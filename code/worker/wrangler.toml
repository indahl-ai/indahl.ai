name = "heuremen-door"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.svg"]
fallthrough = true

[[kv_namespaces]]
binding = "INDAHL_INQUIRIES"
id = "<kv-namespace-id>"

[[send_email]]
name = "INQUIRY_MAIL"
destination_address = "indahl@heuremen.com"

[vars]
INQUIRY_TO = "indahl@heuremen.com"
INQUIRY_FROM = "inquiries@indahl.ai"

[[kv_namespaces]]
binding = "IRIS_BENCH"
id = "<kv-namespace-id>"

[[d1_databases]]
binding = "tape_commits"
database_name = "tape-commits"
database_id = "<d1-database-id>"

# 23 Nov 2026: strict per-visitor limits (Limiter class in worker.js); quantumidleaudit.com binds the same class by script_name
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1-limiter"
new_sqlite_classes = ["Limiter"]
